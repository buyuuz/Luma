<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Luma glow-star logo, originally approved for the Luma rebrand -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112b5f"/>
      <stop offset="1" stop-color="#06112f"/>
    </linearGradient>
    <linearGradient id="star" x1="16%" y1="4%" x2="95%" y2="92%">
      <stop offset="0" stop-color="#43d9ff"/>
      <stop offset=".42" stop-color="#7cddff"/>
      <stop offset=".7" stop-color="#b38fff"/>
      <stop offset="1" stop-color="#dc8ff6"/>
    </linearGradient>
    <radialGradient id="shine">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-.4" y="-.4" width="1.8" height="1.8">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>
  <rect x="28" y="28" width="968" height="968" rx="192" fill="url(#tile)"/>
  <path id="ray" d="M512 96 C574 328 696 461 928 512 C696 562 562 699 512 928 C460 699 326 562 96 512 C326 460 460 324 512 96Z" fill="#576fff" opacity=".75" filter="url(#glow)"/>
  <use href="#ray" fill="url(#star)" opacity="1" filter="none"/>
  <circle cx="512" cy="512" r="260" fill="url(#shine)" opacity=".6"/>
</svg>
